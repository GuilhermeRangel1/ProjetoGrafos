services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data:ro
      - ./src:/app/src:ro

  frontend:
    build:
      context: ./spotify-graph
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    volumes:
      - ./spotify-graph:/app
      - /app/node_modules
    depends_on:
      - backend
